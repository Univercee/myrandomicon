<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Моя иконка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: system-ui, sans-serif;
        background: var(--tg-theme-bg-color, #fff);
        color: var(--tg-theme-text-color, #000);
      }
      #icon { width: min(70vw, 320px); aspect-ratio: 1; border-radius: 24%; background: rgba(128,128,128,.15); object-fit: cover; }
      #icon.hidden { display: none; }
      button { padding: 10px 20px; border: 0; border-radius: 10px; font-size: 16px;
        background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
      button.hidden { display: none; }
    </style>
  </head>
  <body>
    <img id="icon" class="hidden" alt="Моя иконка" />
    <div id="msg"></div>
    <button id="retry" class="hidden">Повторить</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
